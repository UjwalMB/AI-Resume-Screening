# =========================================================
# AI RESUME SCREENING - PRODUCTION OVERRIDES
# =========================================================
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# =========================================================

services:

  # ---------------------------------------------------------
  # DATABASE - Production Settings
  # ---------------------------------------------------------

  db:
    restart: always

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ---------------------------------------------------------
  # BACKEND - Production Settings
  # ---------------------------------------------------------

  backend:
    restart: always

    deploy:
      resources:
        limits:
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


  # ---------------------------------------------------------
  # FRONTEND - Production Settings
  # ---------------------------------------------------------

  frontend:
    restart: always

    deploy:
      resources:
        limits:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
